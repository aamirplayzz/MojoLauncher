name: Anime Launcher Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: gradle :app_mojo:assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeLauncher-APK
          path: app_mojo/build/outputs/apk/full/debug/*.apk

      - name: Rename APK
        run: cp app_mojo/build/outputs/apk/full/debug/*.apk AnimeLauncher.apk

      - name: Publish public download (Releases)
        if: github.ref_name == 'v3_openjdk'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Anime Launcher (latest build)
          body: |
            Latest Anime Launcher APK. Download AnimeLauncher.apk below and install it.
            Built from commit ${{ github.sha }}.
          files: AnimeLauncher.apk
